  <!-- Left G horizontal bar -->
  <rect x="78" y="33" width="20" height="8" fill="#C4A882" rx="1"/>

  <!-- Right G circle (blue) -->
  <circle cx="108" cy="38" r="28" stroke="#2563EB" stroke-width="8" fill="none"/>
